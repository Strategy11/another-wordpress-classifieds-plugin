on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - master
  pull_request:
    types: [ opened, labeled, synchronize ]

name: PHPStan Code Analysis

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phpstan:
    if: contains(github.event.pull_request.labels.*.name, 'run analysis')
    name: PHPStan

    runs-on: ubuntu-latest

    steps:
      - name: "📥 Fetching Repository Contents"
        uses: actions/checkout@v2

      - name: "💽  Installing PHP, Composer, CS2PR"
        uses: shivammathur/setup-php@2.10.0
        with:
          php-version: '8.2'
          coverage: none
          ini-values: display_errors = on, error_reporting = E_ALL
          tools: phpstan, composer

      - name: "📂 Getting Composer Cache Directory"
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: "💾 Caching Composer Packages"
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-phpstan-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: ${{ runner.os }}-composer-phpstan-

      - name: "💽  Installing Composer Packages"
        run: composer install

      - name: "🧪 Test"
        run: vendor/bin/phpstan analyze ./
